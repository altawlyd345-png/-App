name: Build APKs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: [sender, receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Prepare
        run: |
          mkdir -p ${{ matrix.app }}/fonts
          cp shared/protocol.py ${{ matrix.app }}/protocol.py
          curl -L -o ${{ matrix.app }}/fonts/NotoNaskhArabic-Regular.ttf \
            https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf || true
      - name: Keep the same debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ matrix.app }}/.buildozer
          key: buildozer-${{ matrix.app }}-${{ hashFiles(format('{0}/buildozer.spec', matrix.app)) }}
      - name: Install buildozer
        run: pip install buildozer==1.5.0 "cython==0.29.36" virtualenv
      - name: Build APK
        working-directory: ${{ matrix.app }}
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/bin/*.apk
